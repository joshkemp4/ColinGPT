<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Colin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-time" id="lockTime">9:41</div>
    <div class="lock-date" id="lockDate">Monday, September 22</div>

    <form class="passcode-section" id="passcodeForm">
      <div class="passcode-label">Enter Passcode</div>
      <div class="passcode-box" id="passcodeBox">
        <div class="passcode-dots" id="passcodeDots"></div>
        <input
          type="text"
          id="passcodeInput"
          class="passcode-input"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
      </div>
      <div class="lock-error" id="lockError">Incorrect Passcode</div>
    </form>
  </div>

  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="avatar" id="avatar">
          <span class="avatar-initial" id="avatarInitial">C</span>
          <img class="avatar-photo" id="avatarPhoto" alt="Colin">
        </div>
        <div class="contact-name">Colin</div>
      </div>
    </header>

    <main class="messages" id="messages"></main>

    <form class="composer" id="composer">
      <input
        type="text"
        id="messageInput"
        class="composer-input"
        placeholder="Text Message"
        autocomplete="off"
        maxlength="500"
      >
      <button type="submit" class="send-button" id="sendButton" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="lock.js"></script>
  <script src="lockscreen.js"></script>
  <script src="catchphrases.js"></script>
  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
